name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch replaces a run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`, which builds the typed database client the checks need. No database is touched.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Errors fail the run; warnings (the existing backlog) are listed but do not.
      - name: Lint
        run: npm run lint -- --quiet

      - name: Tests
        run: npm test
